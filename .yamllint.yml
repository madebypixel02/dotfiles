extends: default

ignore: |
  node_modules/
  .opencode/

rules:
  line-length:
    max: 120
    level: warning

  document-start: disable

  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: true

  comments:
    min-spaces-from-content: 1

  braces:
    max-spaces-inside: 1
