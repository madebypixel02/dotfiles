name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: commitlint.config.mjs
          failOnErrors: true

  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name pattern
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|ci|release|hotfix|perf|revert)/.+'
          if ! printf '%s' "${BRANCH}" | grep -qE "${pattern}"; then
            printf 'Branch "%s" does not match required pattern: %s\n' "${BRANCH}" "${pattern}" >&2
            printf 'Rename your branch to follow the convention, e.g.: feat/my-feature\n' >&2
            exit 1
          fi
          printf 'Branch name "%s" is valid.\n' "${BRANCH}"

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install and run pre-commit
        run: |
          pip install --quiet pre-commit
          SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSL "${GITLEAKS_URL}/v${GITLEAKS_VERSION}/${TARBALL}" -o "${TARBALL}"
          curl -fsSL "${GITLEAKS_URL}/v${GITLEAKS_VERSION}/${CHECKSUMS}" -o "${CHECKSUMS}"
          sha256sum --check --ignore-missing "${CHECKSUMS}"
          tar -xz -f "${TARBALL}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${TARBALL}" "${CHECKSUMS}"

      - name: Detect secrets
        run: gitleaks detect --source . --redact --no-banner

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run Semgrep
        run: |
          pip install --quiet semgrep==1.166.0
          semgrep --config auto --error --json --exclude semgrep-report.json . | tee semgrep-report.json

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7

  validate-install:
    name: Validate Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run install script dry-run
        run: bash install.sh --dry-run

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - commitlint
      - branch-name
      - pre-commit
      - secrets
      - sast
      - validate-install
    steps:
      - name: Evaluate upstream job results
        run: |
          results='${{ toJSON(needs) }}'
          printf 'Job results:\n%s\n' "${results}"
          if printf '%s' "${results}" | grep -q '"result": "failure"'; then
            printf 'One or more required jobs failed. See individual job logs above.\n' >&2
            exit 1
          fi
          if printf '%s' "${results}" | grep -q '"result": "cancelled"'; then
            printf 'One or more required jobs were cancelled.\n' >&2
            exit 1
          fi
          printf 'All required jobs passed.\n'
