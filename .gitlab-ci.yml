workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  PYTHON_VERSION: "3.12"
  PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  SECRET_DETECTION_EXCLUDED_PATHS: ".git"

default:
  image: python:3.12-slim
  interruptible: true

stages:
  - validate
  - lint
  - security
  - verify
  - release

validate:commit-messages:
  stage: validate
  image: node:20-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - npm install --no-save @commitlint/cli @commitlint/config-conventional
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to HEAD --verbose

validate:branch-name:
  stage: validate
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      pattern='^(feat|fix|chore|docs|refactor|test|ci|release|hotfix|perf|revert)/.+'
      branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      if ! printf '%s' "${branch}" | grep -qE "${pattern}"; then
        printf 'Branch "%s" does not match the required naming pattern.\n' "${branch}" >&2
        printf 'Pattern: %s\n' "${pattern}" >&2
        printf 'Rename your branch to follow the convention, for example: feat/my-feature\n' >&2
        exit 1
      fi
      printf 'Branch name "%s" is valid.\n' "${branch}"

lint:pre-commit:
  stage: lint
  image: node:20-slim
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    key:
      prefix: pre-commit
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit
  script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-pip pipx
    - pipx install pre-commit
    - pipx ensurepath
    - export PATH="${PATH}:/root/.local/bin"
    - pre-commit run --all-files --show-diff-on-failure
  allow_failure: false

security:secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --no-banner
  allow_failure: false

security:sast:
  stage: security
  image: python:3.12-slim
  script:
    - pip install --quiet semgrep==1.166.0
    - semgrep --config auto --error --json --exclude semgrep-report.json . | tee semgrep-report.json
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 7 days
  allow_failure: false

verify:install-dry-run:
  stage: verify
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -y -qq git curl
    - bash install.sh --dry-run

release:draft-notes:
  stage: release
  image: node:20-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - npm install --no-save conventional-changelog-cli
    - npx conventional-changelog -p angular -u -r 1 > RELEASE_NOTES.md
    - cat RELEASE_NOTES.md
  artifacts:
    paths:
      - RELEASE_NOTES.md
    expire_in: 7 days
